spring:
  application:
    name: ttukttak-server
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    time-zone: Asia/Seoul
    deserialization:
      fail-on-unknown-properties: true
    # API는 enum을 소문자로 주고받아요 ("theme", "building")
    mapper:
      accept-case-insensitive-enums: true
    datatype:
      enum:
        write-enums-to-lowercase: true
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            redirect-uri: "${app.public-base-url}/api/v1/auth/{registrationId}/callback" # 프론트(Vercel)가 /api를 넘겨줘서 콜백도 프론트 주소로 받아요

server:
  servlet:
    session:
      timeout: 14d # ponytail: 메모리 세션이라 재시작하면 다시 로그인. 서버 여러 대면 spring-session-jdbc
      cookie:
        same-site: lax
        max-age: 14d

# 구독 확인 메일. SMTP는 SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD 환경변수로 켜요.
# 로컬은 compose.yaml의 Mailpit으로 보내요(http://localhost:8025).
app:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173} # 메일 링크에 쓰는 사이트 주소
  mail:
    from: ${MAIL_FROM:뚝딱 <noreply@ddukddak.dev>}

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write # 테스트 결과를 PR 체크에 올려요
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Gradle 캐시와 wrapper 검증. 캐시는 main에서만 쓰고 PR은 읽기만 해요.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # 컴파일, 테스트, 커버리지, bootJar까지. 테스트가 compose.yaml의 Postgres를 Docker로 띄워요.
      - run: ./gradlew build

      - name: 테스트 결과 요약
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: build/test-results/test/*.xml
          check_name: 테스트 결과
          detailed_summary: true
          # fork PR은 토큰이 읽기 전용이라 체크를 못 만들어요. 그때는 주석과 실행 요약에만 남겨요.
          annotate_only: ${{ github.event.pull_request.head.repo.fork == true }}

      - name: 커버리지 요약
        if: ${{ success() }}
        run: |
          awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7}
            END {
              printf "### 커버리지\n\n| 라인 | 브랜치 |\n| --- | --- |\n"
              printf "| %.1f%% (%d/%d) | %.1f%% (%d/%d) |\n", lc*100/(lm+lc), lc, lm+lc, (bm+bc ? bc*100/(bm+bc) : 100), bc, bm+bc
            }' build/reports/jacoco/test/jacocoTestReport.csv >> "$GITHUB_STEP_SUMMARY"

      - name: 리포트 올리기
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test/html
          retention-days: 7

      # docker job(docker.yml)이 받아서 이미지로 만들어요.
      - name: jar 넘기기
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: build/libs/app.jar
          retention-days: 1

  # main에서 테스트가 통과하면 같은 실행 안에서 이미지를 만들어요.
  docker:
    if: ${{ github.event_name == 'push' }}
    needs: build
    permissions:
      contents: read
      packages: write # ghcr.io에 이미지 올리기
    uses: ./.github/workflows/docker.yml

  # 이미지가 올라가면 Oracle 서버에서 새 이미지로 바꿔 띄워요. 서버 준비는 README의 "서버 준비"를 봐요.
  deploy:
    if: ${{ github.event_name == 'push' }}
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production # 배포 비밀값은 이 환경에만 둬요
    concurrency:
      group: deploy
      cancel-in-progress: false # 배포 중간에 끊지 않아요
    permissions:
      contents: read
      packages: read # 서버가 ghcr.io에서 이미지를 받을 때 쓰는 토큰
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - name: SSH 준비
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # ponytail: 띄우기만 확인해요. 헬스 체크가 필요하면 actuator를 넣고 docker compose up --wait로 바꿔요.
      - name: 배포
        env:
          TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          TAG="sha-${GITHUB_SHA::7}" # docker.yml의 type=sha 태그
          scp deploy/compose.yaml deploy/Caddyfile "$TARGET:ttukttak/"
          printf '%s' "$TOKEN" | ssh "$TARGET" "docker login ghcr.io -u '$ACTOR' --password-stdin"
          ssh "$TARGET" "cd ttukttak && export TAG=$TAG && docker compose pull app && docker compose up -d --remove-orphans; s=\$?; docker logout ghcr.io; docker image prune -f; exit \$s"
